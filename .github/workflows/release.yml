name: Release

# Push a tag like v1.0.1 (or run manually) to build the app and attach the zip to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: ./build.sh --package
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's API sometimes fails (HTTP 502) or leaves a draft — retry, then always publish explicitly.
          for i in 1 2 3 4; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber && break
            else
              gh release create "$GITHUB_REF_NAME" dist/*.zip \
                --title "Mac Memory Monitor $GITHUB_REF_NAME" \
                --notes-file .github/release-notes.md && break
            fi
            echo "attempt $i failed, retrying"; sleep 20
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          gh release view "$GITHUB_REF_NAME" --json isDraft -q '.isDraft' | grep -q false
      - uses: actions/upload-artifact@v4
        with:
          name: MacMemoryMonitor
          path: dist/*.zip
