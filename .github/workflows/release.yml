name: Release

# Push a tag like v1.0.1 (or run manually) to build the app and attach the zip to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: ./build.sh --package
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Mac Memory Monitor $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md || gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: MacMemoryMonitor
          path: dist/*.zip
