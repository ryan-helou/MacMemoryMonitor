name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test
      - name: Build universal app
        run: ./build.sh --package
      - name: Smoke test
        run: '"build/Mac Memory Monitor.app/Contents/MacOS/MacMonitor" --dump | head -5'
